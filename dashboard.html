<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Dashboard</title>
<style>
  :root {
    --bg: #08090d;
    --surface: #111318;
    --surface2: #181b22;
    --surface3: #1e2130;
    --border: #1f2233;
    --border-hover: #2a2d40;
    --text: #e2e4ed;
    --text-dim: #7b7f92;
    --text-muted: #505468;
    --accent: #6366f1;
    --accent2: #818cf8;
    --accent-glow: rgba(99,102,241,0.25);
    --green: #22c55e;
    --green-glow: rgba(34,197,94,0.2);
    --amber: #f59e0b;
    --amber-glow: rgba(245,158,11,0.2);
    --red: #ef4444;
    --red-glow: rgba(239,68,68,0.2);
    --blue: #3b82f6;
    --pink: #ec4899;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(0,0,0,0.4);
    --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* Sidebar */
  .sidebar {
    width: 240px;
    min-width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 16px;
    gap: 4px;
    z-index: 10;
  }
  .sidebar-logo {
    display: flex; align-items: center; gap: 10px;
    padding: 0 12px 24px;
    font-size: 18px; font-weight: 700; letter-spacing: -0.3px;
  }
  .sidebar-logo .dot {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .sidebar-nav { flex:1; display:flex; flex-direction:column; gap:2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border-radius: var(--radius-sm);
    cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-dim); transition: var(--transition);
    border: none; background: none; width: 100%; text-align: left;
    font-family: inherit;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--surface3); color: var(--text); }
  .nav-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink:0; }
  .nav-badge {
    margin-left: auto; font-size: 11px; background: var(--accent);
    color: #fff; padding: 2px 7px; border-radius: 10px; font-weight: 600;
  }
  .sidebar-footer {
    border-top: 1px solid var(--border);
    padding-top: 16px;
    display: flex; flex-direction: column; gap: 4px;
  }
  /* Main */
  .main {
    flex:1; overflow-y:auto; padding: 28px 32px;
    scroll-behavior: smooth;
  }
  .main::-webkit-scrollbar { width: 6px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 3px; }

  /* Header */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 28px;
  }
  .header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
  .header-date { color: var(--text-dim); font-size: 14px; }
  .header-right { display:flex; gap:10px; align-items:center; }

  /* Stats Row */
  .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px;
    transition: var(--transition);
  }
  .stat-card:hover { border-color: var(--border-hover); }
  .stat-label { font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:6px; font-weight:600; }
  .stat-value { font-size:28px; font-weight:700; letter-spacing:-0.5px; }
  .stat-sub { font-size:12px; color:var(--text-muted); margin-top:4px; }
  .stat-icon { float:right; font-size:22px; opacity:0.6; }

  /* Dashboard Grid */
  .dash-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:1100px) { .dash-grid { grid-template-columns:1fr; } }

  /* Cards */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); overflow:hidden;
  }
  .card-header {
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 20px; border-bottom: 1px solid var(--border);
  }
  .card-title { font-size:14px; font-weight:600; letter-spacing:-0.2px; }
  .card-body { padding: 16px 20px; }
  .card-body.nopad { padding:0; }

  /* Buttons */
  .btn {
    display:inline-flex; align-items:center; gap:6px;
    padding: 7px 14px; border-radius: var(--radius-sm);
    font-size:13px; font-weight:500; cursor:pointer;
    border:1px solid var(--border); background: var(--surface2);
    color: var(--text); font-family:inherit;
    transition: var(--transition);
  }
  .btn:hover { background: var(--surface3); border-color: var(--border-hover); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color:#fff; }
  .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); }
  .btn-sm { padding:5px 10px; font-size:12px; }
  .btn-icon {
    width:32px; height:32px; padding:0; display:inline-flex;
    align-items:center; justify-content:center; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:transparent; color:var(--text-dim);
    cursor:pointer; font-size:16px; transition:var(--transition);
  }
  .btn-icon:hover { background:var(--surface3); color:var(--text); }

  /* Goal Card */
  .goal-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .goal-item:last-child { border-bottom:none; }
  .goal-header { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .goal-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .goal-name { font-weight:600; font-size:14px; flex:1; }
  .goal-pct { font-size:12px; color:var(--text-dim); font-weight:600; }
  .kr-item { display:flex; align-items:center; gap:10px; padding:6px 0 6px 16px; }
  .kr-bar-bg { flex:1; height:6px; background:var(--surface3); border-radius:3px; overflow:hidden; }
  .kr-bar-fill { height:100%; border-radius:3px; transition: width 0.6s ease; }
  .kr-text { font-size:12px; color:var(--text-dim); width:180px; flex-shrink:0; }
  .kr-pct { font-size:11px; color:var(--text-muted); width:36px; text-align:right; flex-shrink:0; font-weight:600; }
  .add-goal-btn { margin-top:12px; }

  /* Tasks */
  .task-tabs { display:flex; gap:4px; margin-bottom:14px; }
  .task-tab {
    padding:6px 14px; border-radius:6px; font-size:13px; cursor:pointer;
    border:none; background:transparent; color:var(--text-dim); font-weight:500;
    font-family:inherit; transition:var(--transition);
  }
  .task-tab.active { background:var(--surface3); color:var(--text); }
  .task-item { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .task-item:last-child { border-bottom:none; }
  .task-checkbox {
    width:18px; height:18px; border-radius:5px; border:2px solid var(--border-hover);
    cursor:pointer; flex-shrink:0; transition:var(--transition);
    display:flex; align-items:center; justify-content:center;
    background:transparent; font-size:11px; color:#fff;
  }
  .task-checkbox.done { background:var(--green); border-color:var(--green); }
  .task-label { flex:1; font-size:13px; transition:var(--transition); cursor:pointer; }
  .task-label.done { text-decoration:line-through; color:var(--text-muted); }
  .task-priority { width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .pri-high { background:var(--red); box-shadow:0 0 6px var(--red-glow); }
  .pri-med { background:var(--amber); box-shadow:0 0 6px var(--amber-glow); }
  .pri-low { background:var(--blue); }
  .task-input-row { display:flex; gap:8px; margin-top:10px; }
  .task-input {
    flex:1; padding:8px 12px; border-radius:var(--radius-sm);
    border:1px solid var(--border); background:var(--surface2);
    color:var(--text); font-family:inherit; font-size:13px; outline:none;
    transition:var(--transition);
  }
  .task-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-glow); }

  /* Calendar Mini */
  .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .cal-month { font-weight:600; font-size:14px; }
  .cal-nav { display:flex; gap:4px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; gap:2px; }
  .cal-day-name { font-size:10px; color:var(--text-muted); padding:4px 0; font-weight:600; text-transform:uppercase; }
  .cal-cell {
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    font-size:12px; border-radius:6px; cursor:pointer; color:var(--text-dim);
    transition:var(--transition); position:relative;
  }
  .cal-cell:hover { background:var(--surface3); }
  .cal-cell.today { background:var(--accent); color:#fff; font-weight:700; }
  .cal-cell.other { color:var(--text-muted); opacity:0.4; }
  .cal-cell.has-event::after {
    content:''; position:absolute; bottom:3px; width:4px; height:4px;
    border-radius:50%; background:var(--accent2);
  }
  .cal-cell.today.has-event::after { background:#fff; }
  .cal-events { margin-top:12px; }
  .cal-event {
    display:flex; align-items:center; gap:8px; padding:7px 0;
    border-bottom:1px solid var(--border); font-size:12px;
  }
  .cal-event:last-child { border-bottom:none; }
  .cal-event-dot { width:6px; height:6px; border-radius:3px; background:var(--accent); flex-shrink:0; }
  .cal-event-title { flex:1; }
  .cal-event-time { color:var(--text-muted); font-size:11px; }

  /* Notes */
  .notes-list { max-height:300px; overflow-y:auto; }
  .note-item {
    padding:12px; border-radius:var(--radius-sm); cursor:pointer;
    border:1px solid transparent; transition:var(--transition); margin-bottom:4px;
  }
  .note-item:hover { background:var(--surface2); }
  .note-item.active { background:var(--surface3); border-color:var(--border-hover); }
  .note-item-title { font-weight:600; font-size:13px; margin-bottom:3px; }
  .note-item-preview { font-size:11px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note-item-date { font-size:10px; color:var(--text-muted); margin-top:4px; }

  /* Note Editor Modal */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:flex; align-items:center; justify-content:center;
    z-index:100; backdrop-filter:blur(4px);
  }
  .modal {
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); width:640px; max-width:90vw;
    max-height:80vh; display:flex; flex-direction:column;
  }
  .modal-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 20px; border-bottom:1px solid var(--border);
  }
  .modal-title { font-weight:600; }
  .modal-body { padding:20px; flex:1; overflow-y:auto; }
  .modal-textarea {
    width:100%; min-height:240px; padding:12px;
    background:var(--surface2); border:1px solid var(--border);
    border-radius:var(--radius-sm); color:var(--text);
    font-family:'SF Mono','Fira Code',monospace; font-size:13px;
    outline:none; resize:vertical; line-height:1.6;
  }
  .modal-textarea:focus { border-color:var(--accent); }
  .modal-preview {
    padding:16px; background:var(--surface2); border-radius:var(--radius-sm);
    min-height:100px; font-size:13px; line-height:1.7; margin-top:12px;
  }
  .modal-preview h1,.modal-preview h2,.modal-preview h3 { margin:8px 0 4px; }
  .modal-preview code { background:var(--surface3); padding:2px 6px; border-radius:4px; font-size:12px; }
  .modal-preview pre { background:var(--surface3); padding:12px; border-radius:8px; overflow-x:auto; }
  .modal-preview ul,.modal-preview ol { padding-left:20px; }
  .modal-preview blockquote {
    border-left:3px solid var(--accent); padding-left:12px; color:var(--text-dim); margin:8px 0;
  }
  .modal-actions { display:flex; gap:8px; padding:16px 20px; border-top:1px solid var(--border); justify-content:flex-end; }

  /* Progress Chart */
  .chart-container { position:relative; height:200px; }
  .chart-container canvas { width:100% !important; height:100% !important; }
  .chart-legend { display:flex; gap:16px; margin-top:10px; justify-content:center; }
  .chart-legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dim); }
  .chart-legend-dot { width:8px; height:8px; border-radius:3px; }

  /* Projects */
  .project-card {
    padding:14px; border:1px solid var(--border); border-radius:var(--radius-sm);
    margin-bottom:10px; transition:var(--transition); cursor:pointer;
  }
  .project-card:hover { border-color:var(--border-hover); background:var(--surface2); }
  .project-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .project-name { font-weight:600; font-size:13px; }
  .project-status {
    font-size:10px; padding:3px 8px; border-radius:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px;
  }
  .status-active { background:rgba(99,102,241,0.15); color:var(--accent2); }
  .status-review { background:var(--amber-glow); color:var(--amber); }
  .status-done { background:var(--green-glow); color:var(--green); }
  .project-stats { display:flex; gap:16px; font-size:12px; color:var(--text-dim); }
  .project-bar { height:4px; background:var(--surface3); border-radius:2px; margin-top:8px; overflow:hidden; }
  .project-bar-fill { height:100%; border-radius:2px; transition: width 0.6s ease; }

  /* Animations */
  @keyframes fadeIn {
    from { opacity:0; transform:translateY(8px); }
    to { opacity:1; transform:translateY(0); }
  }
  .card { animation: fadeIn 0.4s ease both; }
  .card:nth-child(1) { animation-delay:0s; }
  .card:nth-child(2) { animation-delay:0.05s; }
  .card:nth-child(3) { animation-delay:0.1s; }
  .card:nth-child(4) { animation-delay:0.15s; }
  .card:nth-child(5) { animation-delay:0.2s; }
  .card:nth-child(6) { animation-delay:0.25s; }

  /* Delete button */
  .btn-danger { background:transparent; border-color:var(--red); color:var(--red); }
  .btn-danger:hover { background:var(--red); color:#fff; }

  /* Empty state */
  .empty-state { text-align:center; padding:32px; color:var(--text-muted); font-size:13px; }

  /* Priority select */
  .priority-select {
    padding:4px 8px; border-radius:4px; border:1px solid var(--border);
    background:var(--surface2); color:var(--text); font-size:11px;
    cursor:pointer; font-family:inherit;
  }

  input[type="text"], input[type="date"], input[type="time"], select {
    font-family: inherit;
  }
</style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-logo"><div class="dot"></div>Prime</div>
  <nav class="sidebar-nav">
    <button class="nav-item active" data-view="dashboard"><span class="nav-icon">◉</span>Dashboard<span class="nav-badge" id="task-count">0</span></button>
    <button class="nav-item" data-view="goals"><span class="nav-icon">◎</span>Goals</button>
    <button class="nav-item" data-view="tasks"><span class="nav-icon">☰</span>Tasks</button>
    <button class="nav-item" data-view="calendar"><span class="nav-icon">▦</span>Calendar</button>
    <button class="nav-item" data-view="notes"><span class="nav-icon">✎</span>Notes</button>
    <button class="nav-item" data-view="projects"><span class="nav-icon">◫</span>Projects</button>
  </nav>
  <div class="sidebar-footer">
    <button class="btn btn-sm" style="width:100%" onclick="resetData()">↺ Reset Sample Data</button>
  </div>
</aside>

<!-- Main Content -->
<main class="main" id="main">
  <!-- Dynamically rendered -->
</main>

<!-- Note Editor Modal -->
<div class="modal-overlay" id="note-modal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <input type="text" class="task-input" id="note-title-input" placeholder="Note title..." style="border:none; background:transparent; font-weight:600; font-size:15px;" />
      <div style="display:flex;gap:8px;">
        <button class="btn btn-sm" onclick="closeNoteModal()">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <textarea class="modal-textarea" id="note-content-input" placeholder="Write markdown..."></textarea>
      <div class="modal-preview" id="note-preview"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-sm" onclick="toggleNotePreview()">Preview</button>
      <button class="btn btn-sm btn-danger" id="note-delete-btn" style="display:none">Delete</button>
      <button class="btn btn-sm btn-primary" onclick="saveNote()">Save Note</button>
    </div>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────────
const STORAGE_KEY = 'prime_dashboard_data';

let state = { goals: [], tasks: [], events: [], notes: [], projects: [], taskView: 'today' };
let currentNoteId = null;
let showingPreview = false;
let calendarMonth = new Date().getMonth();
let calendarYear = new Date().getFullYear();
let selectedDate = formatDate(new Date());

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try { state = JSON.parse(raw); } catch(e) { initSampleData(); }
    if (!state.goals || !state.tasks || !state.events || !state.notes || !state.projects) initSampleData();
    if (!state.taskView) state.taskView = 'today';
  } else {
    initSampleData();
  }
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function resetData() {
  if (confirm('Replace all data with sample data? This cannot be undone.')) {
    initSampleData();
    saveData();
    renderAll();
  }
}

function initSampleData() {
  const today = new Date();
  const y = today.getFullYear();
  const m = today.getMonth();
  const d = today.getDate();
  const fmt = (mo,da) => `${y}-${String(mo+1).padStart(2,'0')}-${String(da).padStart(2,'0')}`;

  state = {
    taskView: 'today',
    goals: [
      {
        id: 'g1', objective: 'Launch Product MVP', color: '#6366f1',
        keyResults: [
          { text: 'Complete core feature set', progress: 85 },
          { text: 'User testing with 20 participants', progress: 55 },
          { text: 'Performance benchmarks < 200ms p95', progress: 70 },
        ]
      },
      {
        id: 'g2', objective: 'Grow to 1,000 Active Users', color: '#22c55e',
        keyResults: [
          { text: 'Publish 8 blog posts / tutorials', progress: 62 },
          { text: 'Launch referral program', progress: 30 },
          { text: 'Social media campaigns running', progress: 90 },
        ]
      },
      {
        id: 'g3', objective: 'Improve Developer Experience', color: '#f59e0b',
        keyResults: [
          { text: 'API docs with interactive examples', progress: 40 },
          { text: 'SDK in Python, JS, and Go', progress: 75 },
          { text: 'Reduce setup time to under 5 minutes', progress: 100 },
        ]
      },
    ],
    tasks: [
      { id: 't1', text: 'Review and merge PR #142', done: false, day: 'today', priority: 'high' },
      { id: 't2', text: 'Design new onboarding flow', done: false, day: 'today', priority: 'high' },
      { id: 't3', text: 'Update API documentation', done: true, day: 'today', priority: 'med' },
      { id: 't4', text: 'Fix mobile nav overflow bug', done: false, day: 'today', priority: 'med' },
      { id: 't5', text: 'Respond to customer emails', done: false, day: 'today', priority: 'low' },
      { id: 't6', text: 'Prepare sprint demo slides', done: false, day: 'week', priority: 'high' },
      { id: 't7', text: 'Code review for team members', done: false, day: 'week', priority: 'med' },
      { id: 't8', text: 'Research analytics tools', done: true, day: 'week', priority: 'low' },
      { id: 't9', text: 'Write integration tests', done: false, day: 'week', priority: 'med' },
      { id: 't10', text: 'Update CI/CD pipeline config', done: false, day: 'week', priority: 'low' },
    ],
    events: [
      { date: fmt(m,d+1), title: 'Sprint Planning', time: '10:00 AM', color: '#6366f1' },
      { date: fmt(m,d+1), title: 'Design Review', time: '2:00 PM', color: '#ec4899' },
      { date: fmt(m,d+2), title: '1:1 with Manager', time: '11:00 AM', color: '#22c55e' },
      { date: fmt(m,d+3), title: 'All-hands Meeting', time: '4:00 PM', color: '#f59e0b' },
      { date: fmt(m,d+5), title: 'Release v2.1', time: '9:00 AM', color: '#3b82f6' },
      { date: fmt(m,d), title: 'Standup', time: '9:30 AM', color: '#6366f1' },
    ],
    notes: [

// ─── Helpers ─────────────────────────────────────────────────
function formatDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function guid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }
function daysInMonth(y,m) { return new Date(y,m+1,0).getDate(); }

function parseMarkdown(md) {
  if (!md) return '';
  let html = md;
  html = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/`(.+?)`/g, '<code>$1</code>');
  html = html.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');
  html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, (m) => m.includes('<ul>') ? m : '<ol>'+m+'</ol>');
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--accent2)">$1</a>');
  html = html.replace(/\n\n/g, '<br><br>');
  html = html.replace(/\n/g, '<br>');
  return html;
}

// ─── Render Engine ───────────────────────────────────────────
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(([k,v]) => {
    if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'className') el.className = v;
    else if (k === 'innerHTML') el.innerHTML = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else el.setAttribute(k, v);
  });
  children.forEach(c => { if (c != null) el.append(typeof c === 'string' ? document.createTextNode(c) : c); });
  return el;
}

function renderAll() {
  const view = document.querySelector('.nav-item.active')?.dataset.view || 'dashboard';
  const main = document.getElementById('main');
  main.innerHTML = '';

  switch(view) {
    case 'dashboard': renderDashboard(main); break;
    case 'goals': renderGoals(main); break;
    case 'tasks': renderTasks(main); break;
    case 'calendar': renderCalendar(main); break;

  updateTaskBadge();
}

  const input = document.getElementById(inputId);

  if (!text) return;
  state.tasks.push({ id: guid(), text, done: false, day: state.taskView==='week'?'week':'today', priority });

  saveData(); renderAll();
  setTimeout(() => document.getElementById(inputId)?.focus(), 100);

  state.tasks = state.tasks.filter(t => t.id !== id);

function renderMiniCal() {

    h('div', { className: 'cal-month' }, months[calendarMonth] + ' ' + calendarYear),

function drawChart() {
  const canvas = document.getElementById('progress-chart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.scale(dpr, dpr);

  const w = rect.width;
  const h = rect.height;
  const pad = { top: 20, right: 20, bottom: 30, left: 40 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;

  ctx.clearRect(0, 0, w, h);

  // Grid
  ctx.strokeStyle = '#1f2233';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + (ch / 4) * i;
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(pad.left + cw, y);
    ctx.stroke();
  }

  // Y labels
  ctx.fillStyle = '#505468';
  ctx.font = '11px Inter, sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const val = 100 - i * 25;
    const y = pad.top + (ch / 4) * i + 4;
    ctx.fillText(val, pad.left - 8, y);
  }

  // Data
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const tasksDone = [5,8,6,9,7,3,2]; // simulated weekly
  const goalPct = [60,62,65,68,72,75,78];

  const barW = Math.min((cw / 7) * 0.35, 20);
  const gap = cw / 7;

  // Bars - Tasks
  tasksDone.forEach((val, i) => {
    const x = pad.left + gap * i + gap/2 - barW;
    const barH = (val / 10) * ch;
    const y = pad.top + ch - barH;
    ctx.fillStyle = 'rgba(99,102,241,0.6)';
    ctx.beginPath();
    ctx.roundRect(x, y, barW, barH, [4,4,0,0]);
    ctx.fill();

    // value label
    ctx.fillStyle = '#7b7f92';
    ctx.font = '10px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(val, x + barW/2, y - 6);
  });

  // Line - Goals
  ctx.beginPath();
  ctx.strokeStyle = '#f59e0b';
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  goalPct.forEach((val, i) => {
    const x = pad.left + gap * i + gap/2;
    const y = pad.top + ch - (val / 100) * ch;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();

  // Dots on line
  goalPct.forEach((val, i) => {
    const x = pad.left + gap * i + gap/2;
    const y = pad.top + ch - (val / 100) * ch;
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#111318';
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = '#7b7f92';
    ctx.font = '10px Inter, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(val+'%', x, y - 12);
  });

  // X labels
  ctx.fillStyle = '#505468';
  ctx.font = '10px Inter, sans-serif';
  ctx.textAlign = 'center';
  days.forEach((d, i) => {
    ctx.fillText(d, pad.left + gap * i + gap/2, h - 8);
  });
}

function timeAgo(iso) {
  if (!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff/60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins+'m ago';
  const hrs = Math.floor(mins/60);
  if (hrs < 24) return hrs+'h ago';
  const days = Math.floor(hrs/24);
  if (days < 7) return days+'d ago';
  return new Date(iso).toLocaleDateString();
}

    body.appendChild(renderProjectItem(p));
  });
  const addBtn = h('button', { className: 'btn btn-sm', style: { marginTop:'8px', width:'100%' }, onclick: addProject }, '+ Add Project');
  body.appendChild(addBtn);

  return h('div', { className: 'card' },
    h('div', { className: 'card-header' },
      h('div', { className: 'card-title' }, '◫ Projects'),
      h('button', { className: 'btn-icon', onclick: () => { document.querySelector('[data-view="projects"]').click(); } }, '↗'),
    ),
    body
  );
}

function renderProjectItem(p) {
  const statusClass = p.status==='active'?'status-active':p.status==='review'?'status-review':'status-done';
  return h('div', { className: 'project-card', onclick: () => updateProject(p.id) },
    h('div', { className: 'project-header' },
      h('div', { className: 'project-name' }, p.name),
      h('div', { className: 'project-status '+statusClass }, p.status),
    ),
    h('div', { className: 'project-stats' },
      h('span', null, p.completed + '/' + p.tasks + ' tasks'),
      h('span', null, p.progress + '%'),
    ),
    h('div', { className: 'project-bar' },
      h('div', { className: 'project-bar-fill', style: { width: p.progress+'%', background: p.color } })
    ),
  );
}

function addProject() {
  const name = prompt('Project name:');
  if (!name) return;
  state.projects.push({ id: guid(), name, status: 'active', progress: 0, tasks: 0, completed: 0, color: '#6366f1' });
  saveData(); renderAll();
}

function updateProject(id) {
  const p = state.projects.find(p => p.id === id);
  if (!p) return;
  const action = prompt('Action: progress (p), status (s), tasks (t), delete (d)', 'p');
  if (!action) return;
  if (action === 'p') { const v = prompt('Progress % (0-100):', p.progress); if (v!==null) p.progress = Math.min(100,Math.max(0,parseInt(v)||0)); }
  if (action === 's') { const v = prompt('Status (active/review/done):', p.status); if (v) p.status = v; }
  if (action === 't') { const ct = prompt('Completed tasks:', p.completed); const tt = prompt('Total tasks:', p.tasks); if (ct!==null) p.completed = parseInt(ct)||0; if (tt!==null) p.tasks = parseInt(tt)||0; if (p.tasks > 0) p.progress = Math.round((p.completed/p.tasks)*100); }
  if (action === 'd') { if (confirm('Delete project?')) { state.projects = state.projects.filter(pr => pr.id !== id); } }
  saveData(); renderAll();
}

// ─── Notes Modal ─────────────────────────────────────────────
function openNote(id) {
  currentNoteId = id;
  const modal = document.getElementById('note-modal');
  const titleInput = document.getElementById('note-title-input');
  const contentInput = document.getElementById('note-content-input');
  const preview = document.getElementById('note-preview');
  const deleteBtn = document.getElementById('note-delete-btn');

  if (id) {
    const note = state.notes.find(n => n.id === id);
    if (note) {
      titleInput.value = note.title;
      contentInput.value = note.content;
      deleteBtn.style.display = 'inline-flex';
    }
  } else {
    titleInput.value = '';
    contentInput.value = '';
    deleteBtn.style.display = 'none';
  }
  showingPreview = false;
  preview.style.display = 'none';
  contentInput.style.display = 'block';
  modal.style.display = 'flex';
  titleInput.focus();
}

function closeNoteModal() {
  document.getElementById('note-modal').style.display = 'none';
  currentNoteId = null;
}

function toggleNotePreview() {
  const contentInput = document.getElementById('note-content-input');
  const preview = document.getElementById('note-preview');
  showingPreview = !showingPreview;
  if (showingPreview) {
    preview.innerHTML = parseMarkdown(contentInput.value);
    preview.style.display = 'block';
    contentInput.style.display = 'none';
  } else {
    preview.style.display = 'none';
    contentInput.style.display = 'block';
    contentInput.focus();
  }
}

function saveNote() {
  const title = document.getElementById('note-title-input').value.trim() || 'Untitled';
  const content = document.getElementById('note-content-input').value;
  const now = new Date().toISOString();

  if (currentNoteId) {
    const note = state.notes.find(n => n.id === currentNoteId);
    if (note) { note.title = title; note.content = content; note.updated = now; }
  } else {
    state.notes.unshift({ id: guid(), title, content, updated: now });
  }
  saveData();
  closeNoteModal();
  renderAll();
}

document.getElementById('note-delete-btn').addEventListener('click', () => {
  if (currentNoteId && confirm('Delete this note?')) {
    state.notes = state.notes.filter(n => n.id !== currentNoteId);
    saveData();
    closeNoteModal();
    renderAll();
  }
});

document.getElementById('note-modal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeNoteModal();
});

// ─── Full Views ──────────────────────────────────────────────
function renderGoals(main) {
  const header = h('div', { className: 'header' },
    h('h1', null, '◎ Goals & OKRs'),
    h('button', { className: 'btn btn-primary btn-sm', onclick: addGoal }, '+ Add Objective'),
  );

    body.appendChild(h('div', { style: 'margin-bottom:12px;' },
      h('div', { style: 'display:flex;align-items:center;gap:8px;margin-bottom:8px;' },
        h('div', { style: 'width:10px;height:10px;border-radius:50%;background:'+goal.color }),

      ),
      h('div', { style: 'height:4px;background:var(--surface3);border-radius:2px;overflow:hidden;' },
        h('div', { style: 'width:'+avgPct+'%;height:100%;background:'+goal.color+';border-radius:2px;transition:width 0.6s;' })
      ),
    ));
    goal.keyResults.forEach((kr, i) => {
      body.appendChild(h('div', { style: 'display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);cursor:pointer;' },
        h('span', { style: 'font-size:12px;color:var(--text-dim);flex:1;', onclick: () => updateKR(goal.id, i) }, kr.text),
        h('div', { style: 'flex:1;height:5px;background:var(--surface3);border-radius:3px;overflow:hidden;' },
          h('div', { style: 'width:'+kr.progress+'%;height:100%;background:'+goal.color+';border-radius:3px;' })
        ),
        h('span', { style: 'font-size:12px;color:var(--text-muted);font-weight:600;width:36px;text-align:right;' }, kr.progress+'%'),
      ));
    });
    body.appendChild(h('button', { className: 'btn btn-sm', style: 'margin-top:10px;', onclick: () => addKeyResult(goal.id) }, '+ Add Key Result'));
    body.appendChild(h('button', { className: 'btn btn-sm btn-danger', style: 'margin-top:10px;margin-left:8px;', onclick: () => deleteGoal(goal.id) }, 'Delete'));

    grid.appendChild(h('div', { className: 'card' },
      h('div', { className: 'card-header' },
        h('div', { className: 'card-title' }, 'Objective'),
      ),
      body
    ));
  });
  if (state.goals.length === 0) {
    grid.appendChild(h('div', { className: 'card', style: 'grid-column:1/-1;' },
      h('div', { className: 'card-body empty-state' }, 'No goals yet. Click "+ Add Objective" to create one.')
    ));
  }
  main.appendChild(grid);
}

function renderTasks(main) {
  const header = h('div', { className: 'header' },
    h('h1', null, '☰ Tasks'),
  );
  main.appendChild(header);

  // tabs
  const tabBar = h('div', { style: 'display:flex;gap:4px;margin-bottom:20px;' });
  ['today','week'].forEach(v => {
    tabBar.appendChild(h('button', {
      className: 'task-tab' + (state.taskView===v?' active':''),
      style: 'padding:8px 20px;font-size:14px;',
      onclick: () => { state.taskView=v; saveData(); renderAll(); },
    }, v==='today'?'☀ Today':'📅 This Week'));
  });
  main.appendChild(tabBar);

  const grid = h('div', { className: 'dash-grid' });

  // Undone tasks
  const undoneCard = h('div', { className: 'card' });
  const undoneBody = h('div', { className: 'card-body' });
  undoneCard.appendChild(h('div', { className: 'card-header' },
    h('div', { className: 'card-title' }, 'Pending'),
  ));
  const tasks = state.tasks.filter(t => state.taskView==='week' || t.day==='today');
  const undone = tasks.filter(t => !t.done);
  undone.forEach(t => undoneBody.appendChild(renderTaskItem(t)));
  if (undone.length === 0) undoneBody.appendChild(h('div',{className:'empty-state'},'All done! 🎉'));

  const inputRow = h('div', { className: 'task-input-row' });
  const input = h('input', { type: 'text', className: 'task-input', placeholder: 'Add a task...', id: 'task-input-full' });
  const priSelect = h('select', { className: 'priority-select' },
    h('option', { value: 'high' }, 'High'),
    h('option', { value: 'med' }, 'Med'),
    h('option', { value: 'low', selected: 'selected' }, 'Low'),
  );
  const addBtn = h('button', { className: 'btn btn-sm btn-primary', onclick: () => addTask('task-input-full', priSelect.value) }, 'Add');
  inputRow.append(input, priSelect, addBtn);
  input.addEventListener('keydown', (e) => { if (e.key==='Enter') addTask('task-input-full', priSelect.value); });
  undoneBody.appendChild(inputRow);
  undoneCard.appendChild(undoneBody);
  grid.appendChild(undoneCard);

  // Done tasks
  const done = tasks.filter(t => t.done);
  const doneCard = h('div', { className: 'card' });
  const doneBody = h('div', { className: 'card-body' });
  doneCard.appendChild(h('div', { className: 'card-header' },
    h('div', { className: 'card-title' }, 'Completed (' + done.length + ')'),
  ));
  done.forEach(t => doneBody.appendChild(renderTaskItem(t)));
  if (done.length === 0) doneBody.appendChild(h('div',{className:'empty-state'},'Nothing completed yet'));
  doneCard.appendChild(doneBody);
  grid.appendChild(doneCard);

  main.appendChild(grid);
}

function renderCalendar(main) {
  const header = h('div', { className: 'header' },
    h('h1', null, '▦ Calendar'),
    h('button', { className: 'btn btn-primary btn-sm', onclick: addEvent }, '+ Add Event'),
  );
  main.appendChild(header);

  const grid = h('div', { className: 'dash-grid' });

  // Month view
  const calCard = h('div', { className: 'card', style: 'grid-column:1/-1;' });
  const calBody = h('div', { className: 'card-body' });
  calBody.appendChild(renderFullMonthCal());
  calCard.appendChild(h('div', { className: 'card-header' },
    h('div', { className: 'card-title' }, 'Month View'),
  ));
  calCard.appendChild(calBody);
  grid.appendChild(calCard);

  // Upcoming Events
  const eventsCard = h('div', { className: 'card', style: 'grid-column:1/-1;' });
  const eventsBody = h('div', { className: 'card-body' });
  const allEvents = [...state.events].sort((a,b) => a.date.localeCompare(b.date));
  if (allEvents.length === 0) {
    eventsBody.appendChild(h('div',{className:'empty-state'},'No events'));
  }
  allEvents.forEach(e => {
    const d = new Date(e.date + 'T12:00:00');
    eventsBody.appendChild(h('div', { style: 'display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);' },
      h('div', { style: 'width:6px;height:6px;border-radius:50%;background:'+(e.color||'#6366f1') }),
      h('div', { style: 'flex:1;' },
        h('div', { style: 'font-weight:600;font-size:14px;' }, e.title),
        h('div', { style: 'font-size:12px;color:var(--text-dim);' }, d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}) + ' · ' + e.time),
      ),
      h('button', { className: 'btn-icon', style: { width:'24px',height:'24px',fontSize:'12px' }, onclick: () => { state.events = state.events.filter(ev => ev !== e); saveData(); renderAll(); } }, '✕'),
    ));
  });
  eventsCard.appendChild(h('div', { className: 'card-header' }, h('div',{className:'card-title'}, 'All Events')));
  eventsCard.appendChild(eventsBody);
  grid.appendChild(eventsCard);

  main.appendChild(grid);
}

function renderFullMonthCal() {
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const container = h('div', null);
  const header = h('div', { className: 'cal-header' },
    h('div', { className: 'cal-month', style: 'font-size:16px;' }, months[calendarMonth] + ' ' + calendarYear),
    h('div', { className: 'cal-nav' },
      h('button', { className: 'btn-icon', onclick: () => { calendarMonth--; if(calendarMonth<0){calendarMonth=11;calendarYear--;} renderAll(); } }, '◀'),
      h('button', { className: 'btn-icon', onclick: () => { calendarMonth++; if(calendarMonth>11){calendarMonth=0;calendarYear++;} renderAll(); } }, '▶'),
    ),
  );
  container.appendChild(header);

  const grid = h('div', { className: 'cal-grid' });
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => grid.appendChild(h('div',{className:'cal-day-name'},d)));

  const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
  const totalDays = daysInMonth(calendarYear, calendarMonth);
  const today = new Date();
  const todayStr = formatDate(today);

  const prevMonth = calendarMonth - 1 < 0 ? 11 : calendarMonth - 1;
  const prevYear = calendarMonth - 1 < 0 ? calendarYear - 1 : calendarYear;
  const prevDays = daysInMonth(prevYear, prevMonth);
  for (let i = firstDay - 1; i >= 0; i--) {
    grid.appendChild(h('div',{className:'cal-cell other'}, String(prevDays - i)));
  }

  const eventDates = new Set(state.events.map(e => e.date));
  const eventMap = {};
  state.events.forEach(e => {
    if (!eventMap[e.date]) eventMap[e.date] = [];
    eventMap[e.date].push(e);
  });

  for (let d = 1; d <= totalDays; d++) {
    const dateStr = `${calendarYear}-${String(calendarMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr;
    const hasEvent = eventDates.has(dateStr);
    const cell = h('div', {
      className: 'cal-cell' + (isToday?' today':'') + (hasEvent?' has-event':''),
      style: { aspectRatio: '1.5' },
      onclick: () => { selectedDate = dateStr; renderAll(); },
    }, String(d));
    if (hasEvent && eventMap[dateStr] && eventMap[dateStr].length > 1) {
      cell.style.boxShadow = 'inset 0 0 0 1px var(--accent)';
    }
    grid.appendChild(cell);
  }
  container.appendChild(grid);
  return container;
}

function renderNotes(main) {
  const header = h('div', { className: 'header' },
    h('h1', null, '✎ Notes'),
    h('button', { className: 'btn btn-primary btn-sm', onclick: () => openNote(null) }, '+ New Note'),
  );
  main.appendChild(header);

  const grid = h('div', { className: 'dash-grid' });
  state.notes.forEach(n => {
    const card = h('div', { className: 'card', style: 'cursor:pointer;' });
    card.addEventListener('click', () => openNote(n.id));
    card.appendChild(h('div', { className: 'card-header' },
      h('div', { className: 'card-title' }, n.title),
      h('div', { style: 'font-size:11px;color:var(--text-muted);' }, timeAgo(n.updated)),
    ));
    const body = h('div', { className: 'card-body' });
    const previewText = n.content.replace(/[#*\n`\[\]\(\)]/g,' ').slice(0,150);
    body.appendChild(h('div', { style: 'font-size:12px;color:var(--text-dim);line-height:1.6;' }, previewText + (n.content.length>150?'...':'')));
    card.appendChild(body);
    grid.appendChild(card);
  });
  if (state.notes.length === 0) {
    grid.appendChild(h('div', { className: 'card', style: 'grid-column:1/-1;' },
      h('div', { className: 'card-body empty-state' }, 'No notes yet. Click "+ New Note" to create one.')
    ));
  }
  main.appendChild(grid);
}

    h('h1', null, '◫ Projects'),
    h('button', { className: 'btn btn-primary btn-sm', onclick: addProject }, '+ Add Project'),
  );

  const grid = h('div', { className: 'dash-grid' });

    grid.appendChild(h('div', { className: 'card' },

      ),
      h('div', { className: 'card-body' },
        h('div', { style: 'display:flex;align-items:center;gap:16px;margin-bottom:10px;' },
          h('div', null,
            h('div', { style: 'font-size:24px;font-weight:700;' }, p.progress + '%'),
            h('div', { style: 'font-size:11px;color:var(--text-muted);' }, 'complete'),
          ),
          h('div', null,

            h('div', { style: 'font-size:11px;color:var(--text-muted);' }, 'tasks done'),
          ),
        ),
        h('div', { style: 'height:6px;background:var(--surface3);border-radius:3px;overflow:hidden;' },

        ),

          h('button', { className: 'btn btn-sm btn-danger', onclick: (e) => { e.stopPropagation(); if(confirm('Delete?')){state.projects=state.projects.filter(pr=>pr.id!==p.id);saveData();renderAll();} } }, 'Delete'),
        ),
      )
    ));
  });

    grid.appendChild(h('div', { className: 'card', style: 'grid-column:1/-1;' },
      h('div', { className: 'card-body empty-state' }, 'No projects yet. Click "+ Add Project" to create one.')
    ));
  }

// ─── Navigation ──────────────────────────────────────────────
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderAll();
  });
});

// ─── Keyboard Shortcuts ──────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape') closeNoteModal();
});

// ─── Init ────────────────────────────────────────────────────
loadData();
renderAll();

// Redraw chart on resize
window.addEventListener('resize', () => {
  if (document.getElementById('progress-chart')) drawChart();
});
